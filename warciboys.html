<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARCI BOYS</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Hero Container with Dark Overlay Background */
        .hero {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 5%;
            /* GANTI URL DI BAWAH INI UNTUK MERUBAH BACKGROUND */
            background: linear-gradient(180deg, rgba(11, 12, 16, 0.75) 0%, rgba(11, 12, 16, 0.85) 60%, #0b0c10 100%),
                        url('https://i.ibb.co/WvS7T38p/WhatsApp-Image-2026-10-15-at-13-42-21.jpg') center/cover no-repeat;
        }

        /* Navigation Header */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 3px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .nav-links {
            display: flex;
            gap: 1.8rem;
            list-style: none;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* Hero Content */
        .hero-content {
            max-width: 650px;
            margin-top: auto;
            margin-bottom: auto;
            padding: 2rem 0;
            z-index: 10;
        }

        .subtitle {
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 7vw, 5rem);
            line-height: 1.05;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .description {
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: rgba(255, 255, 255, 0.7);
            margin: 1.2rem 0 2rem 0;
            line-height: 1.6;
            max-width: 500px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background-color: #ffffff;
            color: #0b0c10;
            padding: 0.75rem 1.6rem;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #e2e8f0;
            transform: translateY(-2px);
        }

        .btn-secondary {
            color: #ffffff;
            padding: 0.75rem 1.6rem;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background-color 0.2s;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Footer Info Bar */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.2rem;
            z-index: 10;
        }

        /* Mobile Responsive adjustment */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .hero {
                padding: 1.5rem 6%;
            }
            .footer-bar {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <section class="hero">
        <!-- Navigation Bar -->
        <nav>
            <div class="logo">
                <div class="logo-icon">W</div>
                WARCI BOYS
            </div>
            <ul class="nav-links">
                <li><a href="#">Beranda</a></li>
                <li><a href="#">Anggota</a></li>
                <li><a href="#">Foto Bersama</a></li>
                <li><a href="#">Tenda</a></li>
                <li><a href="#">Penutup</a></li>
            </ul>
        </nav>

        <!-- Main Hero Content -->
        <div class="hero-content">
            <p class="subtitle">EST 2025 - UNTIL FOREVER</p>
            <h1 class="main-title">
                WARCI BOYS
            </h1>
            <p class="description">
                Waktu mungkin udah bawa kita ke jalan masing-masing, tapi kenangan dan kehangatannya bakal selalu nemenin di sini.
            </p>
            <div class="btn-group">
                <a href="#" class="btn-primary">Lihat Anggota &rarr;</a>
                <a href="#" class="btn-secondary">Foto Bersama</a>
            </div>
        </div>

        <!-- Footer Bar Info -->
        <div class="footer-bar">
            <span>10 ORANG</span>
            <span>WARCI BOYS</span>
            <span>BANYAK CERITA</span>
        </div>
    </section>

</body>
</html>
